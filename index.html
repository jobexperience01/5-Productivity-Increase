<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>5% Productivity Increase – DMAIC Project | Rahimafrooz RGL</title>
<style>
:root{--n:#1b2d6b;--b:#3a63ff;--t:#14b8a6;--a:#ffb020;--r:#ef4444;--ink:#0f1c33;--m:#64748b;--l:#eef2fb}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0a1020;overflow:hidden;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
#st{position:absolute;left:50%;top:50%;width:1280px;height:720px;background:#fff;overflow:hidden;transform-origin:0 0;border-radius:6px}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:fl 14s ease-in-out infinite}
.bg i:nth-child(1){width:420px;height:420px;background:#bcd0ff;right:-120px;top:-140px}
.bg i:nth-child(2){width:360px;height:360px;background:#b6f0e6;left:-120px;bottom:-140px;animation-delay:-6s}
@keyframes fl{50%{transform:translate(30px,24px) scale(1.08)}}
.logo{position:absolute;right:44px;top:22px;height:50px;z-index:5}
.tr{position:absolute;left:56px;top:30px;display:flex;gap:8px;z-index:5}
.tr span{font-weight:700;font-size:11px;line-height:1;letter-spacing:1.2px;text-transform:uppercase;padding:7px 12px;border-radius:20px;background:var(--l);color:#8a97b8;transition:.4s}
.tr span.on{background:var(--n);color:#fff;box-shadow:0 6px 16px #1b2d6b44}
.ft{position:absolute;left:56px;right:56px;bottom:18px;display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;letter-spacing:.4px;z-index:5}
#pg{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--b),var(--t));transition:width .6s}
.s{position:absolute;inset:0;padding:96px 56px 56px;opacity:0;visibility:hidden;transform:translateX(50px) scale(.985);transition:opacity .5s,transform .6s,visibility .6s}
.s.on{opacity:1;visibility:visible;transform:none}
.u{opacity:1}
.on .u{animation:up .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.09s + .15s)}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
.on .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i,0)*.09s + .15s)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
h1{font-size:56px;line-height:1.05;font-weight:800;color:var(--n);letter-spacing:-1.5px}
h2{font-size:38px;font-weight:800;color:var(--n);letter-spacing:-.8px;line-height:1.1}
h2+p,.sub{font-size:16px;color:var(--m);margin:8px 0 22px;max-width:760px}
.g{background:linear-gradient(90deg,var(--b),var(--t));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:#fff;border:1px solid #e3e9f7;border-radius:20px;padding:20px;box-shadow:0 10px 30px #1b2d6b14}
.dk{background:linear-gradient(135deg,var(--n),#2b4bc4);color:#fff;border:0}
.row{display:flex;gap:18px}.col{flex:1;min-width:0}
.big{font-size:54px;font-weight:800;line-height:1;letter-spacing:-1.5px}
.lb{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--m)}
.dk .lb{color:#b8c6ff}
.bar{height:12px;border-radius:8px;background:#e8edf9;overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);border-radius:8px;background:linear-gradient(90deg,var(--b),var(--t))}
.on .bar i{animation:gx 1.3s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.09s + .5s)}
@keyframes gx{from{width:0}}
.chip{display:inline-block;padding:7px 14px;border-radius:20px;background:var(--l);color:var(--n);font-weight:700;font-size:13px;margin:0 6px 6px 0}
.av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--b),var(--t));flex:none}
.ok{display:inline-block;padding:4px 10px;border-radius:12px;background:#d9f7ef;color:#0b8a77;font-weight:700;font-size:12px}
.st{display:grid;gap:16px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.num{width:34px;height:34px;border-radius:50%;background:var(--n);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.arrow{color:var(--b);font-weight:800;font-size:20px}
small{font-size:12px;color:var(--m)}
ring{display:block}
.ring circle{fill:none;stroke-width:16;stroke-linecap:round}
.on .rg{animation:rg 1.8s cubic-bezier(.2,.8,.2,1) both .4s}
@keyframes rg{from{stroke-dashoffset:565}}
#ctl{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border-radius:30px;background:#ffffff1f;backdrop-filter:blur(10px);z-index:9;opacity:.25;transition:.3s}
#ctl:hover,#ctl.v{opacity:1}
#ctl button{border:0;border-radius:22px;padding:10px 18px;font:700 14px Inter,"Segoe UI",Arial,sans-serif;background:#fff;color:var(--n);cursor:pointer}
#ctl button.p{background:var(--b);color:#fff}
#xp{position:fixed;left:-9999px;top:0;width:1280px;height:720px}
.nt *{animation:none!important;transition:none!important}.nt .bg{display:none}
</style></head><body>
<div id="st"></div><div id="ctl"><button id="pv">‹</button><button id="nx" class="p">Next ›</button><button id="fs">⛶</button><button id="ex">⬇ PPTX</button></div><div id="xp"></div>
<script>
/* ===== EDIT HERE: inputs drive every number & the profit calculation ===== */
const C={cut:.05,base:{grid:53.16,paste:78.71},vol:{grid:20842168,paste:36745831},lead:200,
 inv:[['In-motion plate weighing system',4.5],['ICW UPS & current monitoring',.8],['Keypad controllers, bush, roller',.7],['Training & process audit',.2]]};
/* lead = BDT per kg (planning assumption); inv = BDT million */
const f2=x=>(+x).toFixed(2),g0=C.base.grid,p0=C.base.paste,pl0=+(g0+p0).toFixed(2),pl1=125.6,g1=+(g0*125.6/pl0).toFixed(2),p1=+(pl1-g1).toFixed(2);
const kgG=(g0-g1)*C.vol.grid/1000,kgP=(p0-p1)*C.vol.paste/1000,kg=kgG+kgP,gross=kg*C.lead/1e6,inv=C.inv.reduce((a,x)=>a+x[1],0),net=gross-inv,roi=net/inv*100,pay=inv/(gross/12),pct=(pl0-pl1)/pl0*100;
const N=(v,d=0,c=0)=>`<b data-n="${v}" data-d="${d}" data-c="${c}">${c?Math.round(v).toLocaleString('en-US'):(+v).toFixed(d)}</b>`;
const PH=['Define','Measure','Analyze','Improve','Control'];
let k=0;const d=()=>`style="--i:${k++}"`;
const H=(t,p)=>`<h2 class="u" ${d()}>${t}</h2><p class="u" ${d()}>${p}</p>`;
const ring=()=>`<svg class="ring" width="230" height="230" viewBox="0 0 230 230"><circle cx="115" cy="115" r="90" stroke="#e8edf9"/><circle class="rg" cx="115" cy="115" r="90" stroke="url(#gr)" stroke-dasharray="565" stroke-dashoffset="0" transform="rotate(-90 115 115)"/><defs><linearGradient id="gr"><stop offset="0" stop-color="#3a63ff"/><stop offset="1" stop-color="#14b8a6"/></linearGradient></defs><text x="115" y="125" text-anchor="middle" font-size="48" font-weight="800" fill="#1b2d6b"><tspan data-n="${pct}" data-d="1">${pct.toFixed(1)}</tspan>%</text></svg>`;
const mix=[['CBH 1.35',30],['CLP 1.2',12],['CHN 1.35',11],['CDB 1.45',8],['CDB 1.15',8],['Other grid types',31]];
const root=[['Machine','Casted grid weight higher','Corking time too high between two corkings','Cut corking time & frequency','EZA & IBY','10 Jan 2019'],
['Material','Grid weight rises within short time','Cork mixture burns quickly / not prepared properly','Monitoring system for cork preparation & use','EZA & IBY','15 Jan 2019'],
['Machine','Uneven grid thickness','Mold adjustment; old mold, bush & shaft problem','New bush setting & mold modification','RRD','10 Feb 2019'],
['Machine','Pasted plate weight higher','Hopper speed controller (knob) not precise','New keypad speed controller','IBY','10 Feb 2019'],
['Method','Uneven pasting on grid','Pasting belt thickness; squeezing roller issue','Reserved squeezing roller prepared','EZA','15 Feb 2019']];
const A={g:53.12,p:78.29,pl:131.42},STD={g:53,p:78.25,pl:131.25},ph1=(pl0-A.pl)/pl0*100,gap=pl0-pl1,cl=pl0-A.pl;
const dv=[['Grid',g0-STD.g,A.g-STD.g],['Paste',p0-STD.p,A.p-STD.p],['Plate',pl0-STD.pl,A.pl-STD.pl]],COL=['#3a63ff','#14b8a6','#ffb020','#ef4444','#8b5cf6','#94a3b8'];
const devChart=p=>`<svg viewBox="0 0 520 ${p?250:200}" width="100%">${dv.map((r,i)=>{const y=14+i*(p?64:56),s=360/.65;return`<text x="0" y="${y+(p?30:20)}" font-size="15" font-weight="700" fill="#0f1c33">${r[0]}</text><rect x="62" y="${y}" width="${r[1]*s}" height="24" rx="6" fill="#ffb020"/><text x="${70+r[1]*s}" y="${y+17}" font-size="13" font-weight="700" fill="#64748b">+${f2(r[1])}</text>${p?`<rect x="62" y="${y+28}" width="${Math.max(3,r[2]*s)}" height="24" rx="6" fill="#14b8a6"/><text x="${70+r[2]*s}" y="${y+45}" font-size="13" font-weight="700" fill="#0b8a77">+${f2(r[2])}</text>`:''}`}).join('')}<text x="62" y="${p?242:192}" font-size="12" fill="#64748b">gm. above N50 standard per piece${p?' · orange = baseline, teal = Phase 1':''}</text></svg>`;
const gapChart=()=>{const x=v=>40+(v-125)/7.5*440;return`<svg viewBox="0 0 520 220" width="100%"><rect x="${x(125.6)}" y="90" width="${x(pl0)-x(125.6)}" height="26" rx="13" fill="#e8edf9"/><rect x="${x(A.pl)}" y="90" width="${x(pl0)-x(A.pl)}" height="26" rx="13" fill="#14b8a6"/>${[[125.6,'Target','#1b2d6b',1],[A.pl,'Phase 1','#0b8a77',0],[pl0,'Baseline','#d98a00',1]].map(m=>`<line x1="${x(m[0])}" x2="${x(m[0])}" y1="${m[3]?66:84}" y2="${m[3]?118:130}" stroke="${m[2]}" stroke-width="3"/><text x="${x(m[0])}" y="${m[3]?48:150}" text-anchor="middle" font-size="13" font-weight="800" fill="${m[2]}">${m[1]}</text><text x="${x(m[0])}" y="${m[3]?62:166}" text-anchor="middle" font-size="13" fill="#64748b">${f2(m[0])}</text>`).join('')}<text x="260" y="205" text-anchor="middle" font-size="13" fill="#64748b">Gap ${f2(gap)} gm. · closed so far ${f2(cl)} gm. (${Math.round(cl/gap*100)}%)</text></svg>`};
const donut=()=>{let o=0;const R=70,Q=2*Math.PI*R;return`<svg viewBox="0 0 200 200" width="190"><g transform="rotate(-90 100 100)">${mix.map((m,i)=>{const l=m[1]/100*Q,e=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${COL[i]}" stroke-width="30" stroke-dasharray="${l} ${Q-l}" stroke-dashoffset="${-o}"/>`;o+=l;return e}).join('')}</g><text x="100" y="96" text-anchor="middle" font-size="13" fill="#64748b">Sep'18</text><text x="100" y="118" text-anchor="middle" font-size="20" font-weight="800" fill="#1b2d6b">17.17 L</text></svg>`};
const flow=(a,w,h,cs)=>`<svg viewBox="0 0 1100 ${h}" width="100%">${a.map((t,i)=>{const bw=(1100-(a.length-1)*34)/a.length,x=i*(bw+34);return`<rect x="${x}" y="8" width="${bw}" height="${h-16}" rx="14" fill="${cs[i]}"/><text x="${x+bw/2}" y="${h/2+6}" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">${t}</text>${i<a.length-1?`<text x="${x+bw+17}" y="${h/2+8}" text-anchor="middle" font-size="26" font-weight="800" fill="#3a63ff">→</text>`:''}`}).join('')}</svg>`;
const phase=[['Define','Lead per N50 plate is above standard (131.87 vs 131.25 gm.). Goal: +5% productivity, ≤125.6 gm./plate.'],['Measure','2017-18 baseline: grid 53.16, paste 78.71 gm./pcs. CBH 1.35 is 30% of the production mix.'],['Analyze','Fishbone &amp; Why-Why: corking time, cork mixture, mold wear, hopper speed control and pasting roller drive weight up.'],['Improve','Five fixes in Jan–Feb 2019, then two first-pass-yield levers: ICW process control and in-motion plate weighing.'],['Control','Shift-wise weight checks, cork log, weekly audit and Green Belt training; handed over to process owners.']];
const SL=[
/*0*/()=>`<div class="row" style="align-items:center;height:100%;margin-top:-10px"><div class="col"><span class="chip u" ${d()}>Lean Six Sigma · DMAIC · 2018-19</span><h1 class="u" ${d()} style="margin-top:14px">5% Productivity<br><span class="g">Increase</span></h1><p class="sub u" ${d()} style="font-size:20px;margin-top:18px">Lead yield in grid &amp; pasted plate production</p><div class="u" ${d()} style="margin-top:8px"><span class="chip">Rahimafrooz Storage Power Division – RGL</span><span class="chip">Ishwardi Plant</span></div><div class="u" ${d()} style="margin-top:26px;font-size:15px;color:var(--m)">Target: <b style="color:var(--n)">${f2(pl0)} → ${f2(pl1)} gm./plate</b> (N50 pasted plate)</div></div><div class="pop" ${d()}>${ring()}<div class="lb" style="text-align:center;margin-top:8px">Target productivity gain</div></div></div>`,
/*1*/()=>H('Executive summary','DMAIC at a glance: where we started, what we did, where we are.')+`<div class="st c4">${[['Baseline',f2(pl0),'gm./plate · 2017-18'],['Phase 1 result',f2(A.pl),'gm./plate · +'+f2(ph1)+'%'],['Target','≤ '+f2(pl1),'gm./plate · +5%'],['Projected net','BDT '+N(net,1)+'M','per year at target']].map((x,i)=>`<div class="card u ${i==1?'dk':''}" ${d()}><div class="lb">${x[0]}</div><div class="big" style="font-size:34px;margin:8px 0 4px">${x[1]}</div><small>${x[2]}</small></div>`).join('')}</div><div class="st" style="margin-top:14px;gap:10px">${phase.map((x,i)=>`<div class="card u" ${d()} style="display:flex;gap:14px;align-items:center;padding:11px 18px"><span class="chip" style="width:90px;text-align:center;margin:0;${i==3?'background:var(--n);color:#fff':''}">${x[0]}</span><span style="font-size:14px">${x[1]}</span></div>`).join('')}</div>`,
/*2*/()=>H('Project team','Cross-functional team behind the 5% productivity project.')+`<div class="st c4">${[['Sponsor','KMI'],['Champion','SYU'],['Overall Coordinator','DAR'],['Business Coordinator','MAR'],['Team Leader','IBY'],['Team Coordinator','RRD'],['Member · Plate preparation','EZA'],['Member · Plate preparation','ZHU']].map(x=>`<div class="card u pop" ${d()} style="text-align:center"><div class="av" style="margin:0 auto 12px;width:64px;height:64px;font-size:19px">${x[1]}</div><div class="lb">${x[0]}</div></div>`).join('')}</div>`,
/*3*/()=>H('DMAIC roadmap','Ten steps from problem identification to monitoring &amp; reaction.')+`<div class="row" style="margin-top:34px">${[['Define',['1 Problem identification']],['Measure',['2 Quantify the problem','3 Measure current process']],['Analyze',['4 Identify causes','5 Problem selection','6 Generate solutions']],['Improve',['7 Plan of actions','8 Implement &amp; verify','9 Assess effectiveness']],['Control',['10 Monitoring &amp; reaction plan']]].map((x,i)=>`<div class="col card u ${i%2?'':'dk'}" ${d()} style="padding:22px 16px;min-height:300px;transform-origin:top"><div class="big" style="font-size:40px;opacity:.9">${i+1}</div><h2 style="font-size:24px;margin:8px 0 14px;color:inherit">${x[0]}</h2>${x[1].map(s=>`<div style="font-size:14px;margin:9px 0;line-height:1.35">${s}</div>`).join('')}</div>`).join('')}</div>`,
/*4*/()=>H('Define – problem &amp; goal','Lead use per N50 plate is above standard, raising cost and lowering yield.')+`<div class="row"><div class="col card dk u" ${d()}><div class="lb">Goal</div><div class="big" style="margin:8px 0 6px">+${N(pct,0)}%</div><div style="font-size:16px">productivity (N50 plates per kg of lead)</div><div style="font-size:30px;font-weight:800;margin-top:20px">${f2(pl0)} <span class="arrow" style="color:#ffd27a">→</span> ${N(pl1,2)}</div><small style="color:#b8c6ff">gm./plate</small></div><div class="col" style="flex:1.4"><div class="card u" ${d()}><div class="lb">Problem statement</div><p style="margin-top:8px;line-height:1.5">In 2017-18, average lead use was <b>${f2(g0)}</b> gm./pcs (grid) and <b>${f2(p0)}</b> gm./pcs (paste) against N50 standards of 53.00 and 78.25.</p></div><div class="st c2" style="margin-top:16px"><div class="card u" ${d()}><div class="lb">Grid target</div><div class="big" style="font-size:34px">${N(g1,2)}</div><small>from ${f2(g0)} gm./pcs</small></div><div class="card u" ${d()}><div class="lb">Paste target</div><div class="big" style="font-size:34px">${N(p1,2)}</div><small>from ${f2(p0)} gm./pcs</small></div></div></div></div><div class="card u" ${d()} style="margin-top:16px;display:flex;gap:30px;align-items:center"><div class="lb">Business case</div><div><b style="font-size:24px">${N(kg/1000,0,1)} t</b> <small>lead saved / year (at target)</small></div><div><b style="font-size:24px">BDT ${N(gross,1)}M</b> <small>gross savings / year (projected)</small></div></div>`,
/*5*/()=>H('Measure – current performance','Baseline established from 2017-18 production and lead consumption data.')+`<div class="row"><div class="col"><div class="st">${[['Grid · lead per pcs',g0,'N50 std 53.00'],['Paste · lead per pcs',p0,'N50 std 78.25'],['Pasted plate · lead per plate',pl0,'sum of grid + paste']].map(x=>`<div class="card u" ${d()} style="display:flex;justify-content:space-between;align-items:center"><div><div class="lb">${x[0]}</div><small>${x[2]}</small></div><div class="big" style="font-size:40px">${N(x[1],2)}</div></div>`).join('')}</div></div><div class="col card u" ${d()} style="display:flex;gap:16px;align-items:center"><div>${donut()}</div><div style="flex:1"><div class="lb" style="margin-bottom:8px">Production mix by grid type</div>${mix.map((m,i)=>`<div style="display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0"><i style="width:12px;height:12px;border-radius:4px;background:${COL[i]}"></i><span style="flex:1">${m[0]}</span><b>${m[1]}%</b></div>`).join('')}<small>Sample: Sep'18 · 17.17 lakh pcs · 4.42% scrap</small></div></div></div>`,
/*6*/()=>H('Measure – excess lead vs N50 standard','Baseline 2017-18: every plate carries more lead than the standard.')+`<div class="row"><div class="col card u" ${d()}><div class="lb" style="margin-bottom:8px">Excess lead per piece (gm.)</div>${devChart(0)}</div><div class="col st" style="align-content:start">${[['Paste is the largest gap','+'+f2(p0-STD.p)+' gm./pcs above 78.25 standard'],['Grid also high','+'+f2(g0-STD.g)+' gm./pcs above 53.00 standard'],['Plate total','+'+f2(pl0-STD.pl)+' gm. over standard; target needs −'+f2(gap)+' gm. (5%)']].map((x,i)=>`<div class="card u ${i==2?'dk':''}" ${d()}><b style="font-size:17px">${x[0]}</b><br><small ${i==2?'style="color:#b8c6ff"':''}>${x[1]}</small></div>`).join('')}</div></div>`,
/*7*/()=>H('Analyze – root causes','Fishbone and Why-Why analysis on grid weight and paste weight.')+`<div class="st">${root.map(r=>`<div class="card u" ${d()} style="display:flex;align-items:center;gap:14px;padding:13px 18px"><span class="chip" style="width:86px;text-align:center;margin:0">${r[0]}</span><b style="width:230px;font-size:14px">${r[1]}</b><span class="arrow">→</span><span style="flex:1;font-size:14px;color:var(--m)">${r[2]}</span></div>`).join('')}</div>`,
/*8*/()=>H('Improve – action plan','Five corrective actions implemented and verified, Jan–Feb 2019.')+`<div class="row" style="margin-top:6px">${root.map((r,i)=>`<div class="col card u ${i==4?'dk':''}" ${d()} style="padding:18px 14px;min-height:300px"><div class="num" style="${i==4?'background:#fff;color:var(--n)':''}">${i+1}</div><div style="font-weight:800;font-size:15px;margin:14px 0 8px;line-height:1.3">${r[3]}</div><small style="${i==4?'color:#b8c6ff':''}">Owner<br><b>${r[4]}</b></small><br><small style="${i==4?'color:#b8c6ff':''}">Due<br><b>${r[5]}</b></small><div style="margin-top:14px"><span class="ok">✔ Done</span></div></div>`).join('')}</div>`,
/*9*/()=>H('Improve – ICW process control','Inter-cell welding at ~3,000 A: stable welds prevent battery failure after ICW.')+`<div class="row">${[['Monitor','Clamp meter on weld current &amp; supply voltage'],['Stabilise','UPS support to stop voltage dips'],['Prevent','Replace weld tips after ~2,000 shots'],['Verify','Cut-sample inspection for cold joints, bubbles, missing lead']].map((x,i)=>`<div class="col card u" ${d()}><div class="num">${i+1}</div><div style="font-weight:800;font-size:18px;margin:10px 0 6px">${x[0]}</div><small>${x[1]}</small></div>`).join('')}</div><div class="card u" ${d()} style="margin-top:14px"><div class="lb" style="margin-bottom:8px">Quality gate after ICW – 2 machines compared, worse one corrected or replaced</div>${flow(['ICW weld','Online shock test','Endurance test','Pull test','✔ Pass'],0,64,['#1b2d6b','#3a63ff','#14b8a6','#d98a00','#0b8a77'])}</div><div class="card dk u" ${d()} style="margin-top:14px;text-align:center;font-size:18px;font-weight:700">Stable welds → no battery failure in shock test → <span style="color:#ffd27a">↑ first pass yield → ↑ productivity</span></div>`,
/*10*/()=>H('Improve – in-motion plate weighing','Every pasted plate weighed on the moving conveyor: no batches, no line stop.')+`<div class="card u" ${d()}>${flow(['Pasted plate','Load cells + encoder','PLC: in range?','✔ Continue / ✖ Pusher reject'],0,70,['#1b2d6b','#3a63ff','#14b8a6','#d98a00'])}<small style="display:block;margin-top:6px">HMI shows live weight, status and alarms · stores last 100 readings · CSV export via USB</small></div><div class="st c4" style="margin-top:14px">${[['Non-stop production','weighed on the move'],['Less waste','no excess lead per plate'],['100% quality check','every plate, not samples'],['↑ Cpk · ↓ DPC','tight weight, fewer defects']].map((x,i)=>`<div class="card u ${i==3?'dk':''}" ${d()}><b style="font-size:17px">${x[0]}</b><br><small ${i==3?'style="color:#b8c6ff"':''}>${x[1]}</small></div>`).join('')}</div><div class="card dk u" ${d()} style="margin-top:14px;text-align:center;font-size:18px;font-weight:700">100% inspection → defects caught at source → <span style="color:#ffd27a">↑ plate-weight first pass yield → ↑ productivity</span></div>`,
/*11*/()=>H('Improve – expected impact on productivity','Overall first pass yield = weld FPY × plate-weight FPY. Every point gained saves lead.')+`<div class="row"><div class="card u" ${d()} style="width:330px"><div class="lb">Illustration – replace with plant data</div><svg viewBox="0 0 300 230" width="100%">${[['Today',95.1,'#ffb020',40],['With levers',98,'#14b8a6',170]].map(b=>{const h=(b[1]-90)/10*150;return`<rect x="${b[3]}" y="${190-h}" width="90" height="${h}" rx="8" fill="${b[2]}"/><text x="${b[3]+45}" y="${182-h}" text-anchor="middle" font-size="17" font-weight="800" fill="#0f1c33">${b[1]}%</text><text x="${b[3]+45}" y="212" text-anchor="middle" font-size="13" fill="#64748b">${b[0]}</text>`}).join('')}</svg><small>98% × 97% → 99% × 99%</small></div><div class="col card u" ${d()}><div class="lb" style="margin-bottom:6px">KPIs to track (fill from plant data)</div>${[['ICW weld first pass yield','__ %','↑'],['Shock-test failures after ICW','__ %','↓'],['Plate-weight first pass yield','__ %','↑'],['Plate-weight Cpk','__','↑'],['DPC value','__','↓'],['N50 productivity (gm./plate)',f2(pl0),'≤ '+f2(pl1)]].map(x=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef2fb;font-size:14px"><b>${x[0]}</b><span>${x[1]} <span class="arrow">→</span> <b style="color:#0b8a77">${x[2]}</b></span></div>`).join('')}</div></div>`,
/*12*/()=>H('Results – Phase 1 vs target','Phase 1 closed '+f2(cl)+' gm. of the '+f2(gap)+' gm. gap. ICW and in-motion weighing are the next levers.')+`<div class="row"><div class="col card u" ${d()}><div class="lb" style="margin-bottom:6px">Excess lead vs standard</div>${devChart(1)}</div><div class="col card u" ${d()}><div class="lb" style="margin-bottom:6px">Plate weight: gap to target</div>${gapChart()}</div></div><div class="st c3" style="margin-top:14px">${[['Grid',g0,A.g],['Paste',p0,A.p],['Pasted plate (N50)',pl0,A.pl]].map(x=>`<div class="card u" ${d()}><div class="lb">${x[0]}</div><b style="font-size:22px;color:var(--n)">−${f2(x[1]-x[2])} gm.</b> <small>${f2(x[1])} → ${f2(x[2])}</small></div>`).join('')}</div>`,
/*13*/()=>H('Financial outlook – projected at target','Annual savings if the 5% target is reached. Planning assumptions, not yet realised.')+`<div class="row"><div class="col card u" ${d()}><div class="lb" style="margin-bottom:8px">Calculation</div>${[['Grid lead saved',`${f2(g0-g1)} g × ${(C.vol.grid/1e6).toFixed(2)}M pcs`,Math.round(kgG).toLocaleString('en-US')+' kg'],['Paste lead saved',`${f2(p0-p1)} g × ${(C.vol.paste/1e6).toFixed(2)}M pcs`,Math.round(kgP).toLocaleString('en-US')+' kg'],['Total lead saved','× BDT '+C.lead+' / kg',Math.round(kg).toLocaleString('en-US')+' kg'],['Gross savings','',`BDT ${gross.toFixed(2)}M`],['Investment','− '+C.inv.length+' items',`BDT ${inv.toFixed(2)}M`]].map(x=>`<div class="u" ${d()} style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef2fb;font-size:14px"><span><b>${x[0]}</b><br><small>${x[1]}</small></span><b>${x[2]}</b></div>`).join('')}<div class="u dk card" ${d()} style="margin-top:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center"><b>Net profit / year</b><span class="big" style="font-size:32px">BDT ${N(net,2)}M</span></div></div><div style="width:400px" class="st"><div class="card u" ${d()}><div class="lb" style="margin-bottom:12px">BDT million</div>${[['Gross savings',gross,'var(--b)'],['Investment',inv,'var(--a)'],['Net profit',net,'var(--t)']].map(x=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>${x[0]}</span><span>${x[1].toFixed(1)}</span></div><div class="bar" style="height:16px"><i style="--w:${x[1]/gross*100}%;background:${x[2]}"></i></div></div>`).join('')}</div><div class="st c2"><div class="card u" ${d()}><div class="lb">ROI</div><div class="big" style="font-size:36px">${N(roi,0)}%</div></div><div class="card u" ${d()}><div class="lb">Payback</div><div class="big" style="font-size:36px">${N(pay,1)}<small> mo</small></div></div></div></div></div><small class="u" style="display:block;margin-top:10px;--i:${k++}">Planning assumptions (edit in <b>C</b>): lead BDT ${C.lead}/kg · 2018-19 volumes · investment BDT ${inv.toFixed(1)}M (${C.inv.map(x=>x[0]).join(', ')}).</small>`,
/*14*/()=>H('Control &amp; handover','Sustaining the 5% gain through monitoring, reaction and audit.')+`<div class="row"><div class="col card u" ${d()}><div class="lb" style="margin-bottom:6px">Monitoring &amp; reaction plan</div>${['Casted grid weight &amp; lead use checked every shift; MIS updated','Cork mixture log sheet updated and verified','Grid casting manpower chosen by grid type &amp; production priority','Pasted plate weight &amp; paste use checked every shift'].map((x,i)=>`<div class="u" ${d()} style="display:flex;gap:12px;margin:14px 0;align-items:flex-start"><div class="num">${i+1}</div><div style="font-size:14px;line-height:1.4">${x}</div></div>`).join('')}</div><div class="col st" style="align-content:start"><div class="card dk u" ${d()}><div class="lb">Status</div><div style="font-size:19px;font-weight:700;margin-top:6px">Phase 1 gains held · standard work handed over to process owners</div></div><div class="card u" ${d()}><b>✔ Training</b><br><small>Process &amp; Green Belt training for all team members</small></div><div class="card u" ${d()}><b>✔ Process audit</b><br><small>Weekly audit across all concerned sections</small></div></div></div>`,
/*15*/()=>`<div style="text-align:center;margin-top:10px"><h1 class="u" ${d()} style="font-size:52px">Summary &amp; <span class="g">next steps</span></h1><p class="sub u" ${d()} style="margin:10px auto 26px;font-size:17px">Phase 1 proved the method. The next cycle goes for the full 5%.</p></div><div class="st c4">${[['+'+f2(ph1)+'%','Phase 1 gain · '+f2(cl)+' gm./plate'],['5%','target · ≤ '+f2(pl1)+' gm./plate'],['ICW + weighing','next cycle: ↑ first pass yield, Cpk'],['BDT '+N(net,1)+'M','projected net / year at target']].map((x,i)=>`<div class="card u pop ${i==3?'dk':''}" ${d()} style="text-align:center"><div class="big" style="font-size:${i==2?24:38}px">${x[0]}</div><div class="lb" style="margin-top:8px">${x[1]}</div></div>`).join('')}</div><p class="sub u" ${d()} style="text-align:center;margin:26px auto 0;font-size:20px">Thank you · Questions &amp; answers</p>`];

function cnt(s){s.querySelectorAll('[data-n]').forEach(e=>{const v=+e.dataset.n,dd=+e.dataset.d,cm=+e.dataset.c,t0=performance.now();(function t(n){const p=Math.min(1,(n-t0)/1500),x=v*(1-Math.pow(1-p,3));e.textContent=cm?Math.round(x).toLocaleString('en-US'):x.toFixed(dd);if(p<1)requestAnimationFrame(t)})(t0)})}
